name: Build Android APK (TRUST WALLET PRO)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Standalone Offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies & Compile Assets
        run: |
          echo "Compiling React SPA into standalone offline assets..."
          npm install --legacy-peer-deps
          npm run build
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/dist
          cp -r dist app/src/main/assets/
          echo "Verifying bundled assets:"
          ls -la app/src/main/assets/dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          echo "Configuring pre-installed Android SDK at $ANDROID_HOME..."
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Standalone Debug APK
        run: |
          echo "Compiling Android APK with embedded offline assets..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          echo "Searching for generated APK file..."
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "=================================================="
            echo "SUCCESS: Standalone APK Generated at $APK_FILE"
            ls -lh "$APK_FILE"
            echo "=================================================="
          else
            echo "ERROR: No APK was generated in app/build/outputs/apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TRUST-WALLET-PRO-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
